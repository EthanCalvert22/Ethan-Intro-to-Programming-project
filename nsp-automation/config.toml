# Close updater settings. Secrets (CLOSE_API_KEY, NOTION_TOKEN) are never
# stored here: they come from environment variables / GitHub secrets only.
# IDs below were read from your live accounts on 2026-11-04.

timezone = "Europe/Lisbon"

[close]
# Safety: every run first checks that this pipeline exists in the org the API
# key belongs to. "NSP - VP Sales" does not have it, so a key from that org is
# refused before anything is read or written.
pipeline_id = "pipe_0Lvn5aQMMILogzbRSrQWHB"
pipeline_name = "M&A Opportunities"
# Lead status and rename changes are only allowed on leads that have an
# opportunity in the M&A pipeline.
require_ma_opportunity_for_lead_edits = true
# Never delete an opportunity in a won stage.
protect_won = true
# At most this many queue rows are applied per run (limits any mistake).
max_changes_per_run = 25

# Short names you (or Claude) can use for stages. Matching also ignores case,
# punctuation and the "Lost:" prefix, so "Qualified (Materials Requested)",
# "qualified materials requested" and "Too Small" all work.
[close.stage_aliases]
booked = "Call Booked"
held = "Screening Call Held"
screening = "Screening Call Held"
qualified = "Qualified, Materials Requested"
materials = "Qualified, Materials Requested"
diligence = "Soft Diligence"
senior = "Senior Team Call"
"senior team" = "Senior Team Call"
fee = "Fee and Engagement Review"
"fee review" = "Fee and Engagement Review"
engagement = "Engagement Sent"
signed = "Engagement Signed"
won = "Engagement Signed"
"no show" = "No Show: Dial Back"
"dial back" = "No Show: Dial Back"

[notion]
close_changes_data_source_id = "cb971d35-aeb8-4182-82cd-642ce0c47fbd"
