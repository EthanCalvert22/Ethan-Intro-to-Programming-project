[project]
name = "nsp-automation"
version = "0.1.0"
description = "Close updater for the NSP M&A pipeline (Notion queue -> Close REST API)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "responses>=0.25"]

[project.scripts]
nsp = "nsp.cli:main"

[tool.setuptools]
packages = ["nsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
