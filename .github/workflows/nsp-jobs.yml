# Scheduled NSP M&A jobs (Lisbon times). GitHub cron is UTC only, so each slot is
# scheduled at both possible UTC hours and `nsp gate` lets through only the one
# that matches Lisbon local time. Daylight saving needs no edits.
name: NSP scheduled jobs

on:
  schedule:
    - cron: "0 1,2 * * 2-6"     # 02:00 Lisbon Tue-Sat: overnight follow-ups (Batch API) + inbox sweep
    - cron: "0 3,4 * * 1,3,5"   # 04:00 Lisbon Mon/Wed/Fri: deal intel
    - cron: "0 6,7 * * 1-5"     # 07:00 Lisbon weekdays: collect batch, bookings, morning brief
    - cron: "30 12,13 * * 1-5"  # 13:30 Lisbon weekdays: bookings, inbox sweep, refreshed brief
    - cron: "30 16,17 * * 1-5"  # 17:30 Lisbon weekdays: afternoon follow-ups + inbox sweep
  workflow_dispatch:
    inputs:
      job:
        description: "Run one job now"
        required: true
        type: choice
        options: [overnight, intel, morning, preshift, midshift]

permissions:
  contents: read

concurrency:
  group: nsp-state
  cancel-in-progress: false

env:
  CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
  CALENDLY_TOKEN: ${{ secrets.CALENDLY_TOKEN }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nsp-automation
    steps:
      - name: Pick the job for this trigger
        id: pick
        working-directory: .
        run: |
          case "${{ github.event.schedule }}" in
            "0 1,2 * * 2-6")    echo "job=overnight" >> "$GITHUB_OUTPUT"; echo "at=02:00" >> "$GITHUB_OUTPUT" ;;
            "0 3,4 * * 1,3,5")  echo "job=intel"     >> "$GITHUB_OUTPUT"; echo "at=04:00" >> "$GITHUB_OUTPUT" ;;
            "0 6,7 * * 1-5")    echo "job=morning"   >> "$GITHUB_OUTPUT"; echo "at=07:00" >> "$GITHUB_OUTPUT" ;;
            "30 12,13 * * 1-5") echo "job=preshift"  >> "$GITHUB_OUTPUT"; echo "at=13:30" >> "$GITHUB_OUTPUT" ;;
            "30 16,17 * * 1-5") echo "job=midshift"  >> "$GITHUB_OUTPUT"; echo "at=17:30" >> "$GITHUB_OUTPUT" ;;
            *)                  echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"; echo "at=" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nsp-automation/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lisbon time gate
        id: gate
        if: steps.pick.outputs.at != ''
        continue-on-error: true
        run: python -m nsp gate --at "${{ steps.pick.outputs.at }}" --window 50
      - name: Restore state
        if: steps.gate.outcome != 'failure'
        uses: actions/cache/restore@v6
        with:
          path: nsp-automation/state
          key: nsp-state-${{ github.run_id }}
          restore-keys: nsp-state-
      - name: Restore cost log
        if: steps.gate.outcome != 'failure'
        uses: actions/cache/restore@v6
        with:
          path: nsp-automation/logs/cost.jsonl
          key: nsp-cost-${{ github.run_id }}
          restore-keys: nsp-cost-

      - name: Overnight (02:00)
        if: steps.gate.outcome != 'failure' && steps.pick.outputs.job == 'overnight'
        run: |
          python -m nsp overnight --batch
          python -m nsp sweep
      - name: Deal intel (04:00)
        if: steps.gate.outcome != 'failure' && steps.pick.outputs.job == 'intel'
        run: python -m nsp intel
      - name: Morning (07:00)
        if: steps.gate.outcome != 'failure' && steps.pick.outputs.job == 'morning'
        run: |
          python -m nsp overnight-collect
          python -m nsp sync-bookings
          python -m nsp brief
      - name: Pre-shift (13:30)
        if: steps.gate.outcome != 'failure' && steps.pick.outputs.job == 'preshift'
        run: |
          python -m nsp sync-bookings
          python -m nsp sweep
          python -m nsp brief
      - name: Mid-shift (17:30)
        if: steps.gate.outcome != 'failure' && steps.pick.outputs.job == 'midshift'
        run: |
          python -m nsp overnight
          python -m nsp sweep
      - name: Spend this month
        if: always() && steps.gate.outcome != 'failure'
        run: python -m nsp cost

      - name: Save state
        if: always() && steps.gate.outcome != 'failure'
        uses: actions/cache/save@v6
        with:
          path: nsp-automation/state
          key: nsp-state-${{ github.run_id }}
      - name: Save cost log
        if: always() && steps.gate.outcome != 'failure'
        uses: actions/cache/save@v6
        with:
          path: nsp-automation/logs/cost.jsonl
          key: nsp-cost-${{ github.run_id }}
