name: Close updater tests

on:
  push:
    paths: ["nsp-automation/**", ".github/workflows/nsp-*.yml"]
  pull_request:
    paths: ["nsp-automation/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nsp-automation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest responses
      - run: python -m pytest -q
