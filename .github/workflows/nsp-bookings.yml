# Calendly -> Close + Notion booking sync. Free on GitHub Actions within the
# monthly minutes; no Claude API calls. Scheduled workflows only run from the
# repository's default branch.
name: NSP booking sync

on:
  schedule:
    - cron: "*/15 11-22 * * 1-5"   # every 15 min, roughly 11:00-23:00 Lisbon, weekdays
    - cron: "5 */3 * * *"          # every 3 hours otherwise (weekends, nights)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsp-state
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nsp-automation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nsp-automation/requirements.txt
      - run: pip install -r requirements.txt
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: nsp-automation/state
          key: nsp-state-${{ github.run_id }}
          restore-keys: nsp-state-
      - name: Sync bookings
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          CALENDLY_TOKEN: ${{ secrets.CALENDLY_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python -m nsp sync-bookings
      - name: Save state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: nsp-automation/state
          key: nsp-state-${{ github.run_id }}
